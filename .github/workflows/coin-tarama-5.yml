name: Coin Tarama 5 — hazırlık, tetik ve iptal

on:
  schedule:
    - cron: '1-56/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: coin-tarama-5-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      SCANNER_STATE_BRANCH: scanner-state-coin-tarama-5
      NOTIFICATION_CHANNEL: ${{ vars.NOTIFICATION_CHANNEL == 'github_issue' && 'github_issue' || 'report' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate causal candles, phases and notification integrity
        run: python -m unittest test_coin5 -q
      - name: Restore independent Coin Tarama 5 state
        run: python coin5_scan.py pull-state
      - name: Observe both spot venues and position evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python coin5_scan.py scan --channel "$NOTIFICATION_CHANNEL"
      - name: Checkpoint observations before notifications
        run: python coin5_scan.py push-state
      - name: Notify preparation, trigger and invalidation events
        env:
          GH_TOKEN: ${{ github.token }}
          COIN_NOTIFY_USER: ${{ vars.COIN_NOTIFY_USER }}
        run: python coin5_scan.py notify --channel "$NOTIFICATION_CHANNEL"
      - name: Measure real observations after notifications
        run: python coin5_scan.py measure
      - name: Preserve independent observations and deliveries
        if: ${{ always() && hashFiles('cloud_output_coin5/ready.txt') != '' }}
        run: python coin5_scan.py push-state
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coin-tarama-5-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud_output_coin5/report.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Mark incomplete source or measurement coverage
        if: ${{ always() && hashFiles('cloud_output_coin5/ready.txt') != '' }}
        run: python coin5_scan.py check-status
