name: Coin Tarama 5 — V4 geniş erken radar

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Bounded observation session in minutes (1-110)
        type: string
        default: '110'

permissions:
  contents: write
  issues: write

concurrency:
  group: coin-tarama-5-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      PYTHONUTF8: '1'
      SCANNER_STATE_BRANCH: scanner-state-coin-tarama-5-v4
      NOTIFICATION_CHANNEL: ${{ vars.NOTIFICATION_CHANNEL == 'github_issue' && 'github_issue' || 'report' }}
      COIN5_SESSION_MINUTES: ${{ inputs.session_minutes || '110' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate independent markets, early radar, entries and measurements
        run: python -m unittest test_coin5 test_coin5_v2 test_coin5_v3 test_coin5_v4 test_notification_style -q
      - name: Run bounded checkpointed five-minute V4 session
        env:
          GH_TOKEN: ${{ github.token }}
          COIN_NOTIFY_USER: ${{ vars.COIN_NOTIFY_USER }}
        run: python -u coin5_v4_worker.py --minutes "$COIN5_SESSION_MINUTES" --channel "$NOTIFICATION_CHANNEL"
      - name: Preserve report and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coin-tarama-5-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud_output_coin5_v4/report.md
            cloud_output_coin5_v4/state.json
          if-no-files-found: ignore
          retention-days: 14
