name: Coin Tarama Meme — V7 erken radar ve giriş

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Bounded worker session in minutes (1-110)
        type: string
        default: '110'

permissions:
  contents: write
  issues: write

concurrency:
  group: coin-tarama-meme-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      PYTHONUTF8: '1'
      SCANNER_STATE_BRANCH: scanner-state-meme-v7
      MEME_SESSION_MINUTES: ${{ inputs.session_minutes || '110' }}
      MEME_RPC_SOLANA: ${{ secrets.MEME_RPC_SOLANA }}
      MEME_RPC_ETHEREUM: ${{ secrets.MEME_RPC_ETHEREUM }}
      MEME_RPC_BNB: ${{ secrets.MEME_RPC_BNB }}
      MEME_RPC_ROBINHOOD: ${{ secrets.MEME_RPC_ROBINHOOD }}
      MEME_RPC_HYPEREVM: ${{ secrets.MEME_RPC_HYPEREVM }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate unchanged risk and closed-candle rules
        run: python -m unittest test_meme_scan test_meme_formation test_meme_social_watch test_meme_followup_watch test_meme_hybrid -q
      - name: Validate V5 discovery, stages, migration and fixed quantities
        run: python -m unittest test_meme_v5 -q
      - name: Validate first base, buy pressure, cap and V5 archive preservation
        run: python -m unittest test_meme_v6 -q
      - name: Validate V7 identity retention, closed bases, risk gates and idempotent delivery
        run: python -m unittest test_meme_v7 -q
      - name: Run bounded V7 session using continuous discovery feed
        env:
          GH_TOKEN: ${{ github.token }}
          COIN_NOTIFY_USER: ${{ vars.COIN_NOTIFY_USER }}
          GH_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at || '' }}
        run: python -u meme_v7.py worker --minutes "$MEME_SESSION_MINUTES"
      - name: Preserve report and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coin-tarama-meme-v7-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud_output_meme_v7/report.md
            cloud_output_meme_v7/summary.json
            cloud_output_meme_v7/publication_health.json
            cloud_output_meme_v7/publication_journal.json
            cloud_output_meme_v7/recovery_state.json
          if-no-files-found: ignore
          retention-days: 14
