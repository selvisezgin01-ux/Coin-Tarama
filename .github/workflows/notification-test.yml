name: Telefon bildirimi denemesi

on:
  workflow_dispatch:
    inputs:
      scan_label:
        description: Bildirimde gösterilecek sürüm
        type: choice
        default: Coin Tarama 2
        options:
          - Coin Tarama 2
          - Coin Tarama 3
          - Coin Tarama Meme
          - Shortçu Kıstır
          - Shortçu Kıstır — oran değişimi

permissions:
  issues: write

concurrency:
  group: coin-notification-test
  cancel-in-progress: false

jobs:
  notification-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send clearly marked test mention from the scanner bot
        env:
          GH_TOKEN: ${{ github.token }}
          COIN_NOTIFY_USER: ${{ vars.COIN_NOTIFY_USER }}
          COIN_SCAN_LABEL: ${{ inputs.scan_label || 'Coin Tarama 2' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen

          recipient = os.environ['COIN_NOTIFY_USER'].strip()
          label = os.environ['COIN_SCAN_LABEL']
          if label not in ('Coin Tarama 2', 'Coin Tarama 3', 'Coin Tarama Meme', 'Shortçu Kıstır', 'Shortçu Kıstır — oran değişimi'):
              raise ValueError('Unknown scanner label.')
          if not re.fullmatch(r'[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?', recipient):
              raise ValueError('Set COIN_NOTIFY_USER to a GitHub username without @.')
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          marker = f"<!-- coin-scanner:mobile-notification-test:{os.environ['GITHUB_RUN_ID']} -->"
          with urlopen(Request(url + '?state=all&per_page=100', headers=headers), timeout=25) as response:
              issues = json.load(response)
          existing = next((i for i in issues if marker in (i.get('body') or '')), None)
          if existing:
              issue = existing
          else:
              payload = {'title': label + ' · Bildirim denemesi — coin sinyali değildir',
                         'body': f'@{recipient}\n\n{label}\n\nBu, GitHub Mobile bildirimini kontrol etmek için gönderilen tek seferlik deneme kaydıdır. Coin adayı veya alım sinyali değildir. Yeni aday bildirimleri de seni bu şekilde etiketleyecek.\n\nTelefonunda GitHub için etiketlenme, bildirim ve ses izinlerini açık tut. Ses, telefonun sessiz/odak modu ve uygulama ayarlarına bağlıdır.\n\n' + marker}
              if label == 'Shortçu Kıstır — oran değişimi':
                  from datetime import datetime, timedelta
                  from zoneinfo import ZoneInfo
                  current = datetime.now(ZoneInfo('Europe/Istanbul')).replace(second=0, microsecond=0)
                  previous = current - timedelta(minutes=5)
                  payload['title'] = 'TEST · Shortçu Kıstır · Short payı yükseliyor · %60 → %65'
                  payload['body'] = (
                      f'@{recipient}\n\n'
                      '**TEST — aşağıdaki coin ve oranlar örnektir; gerçek piyasa verisi veya sinyal değildir.**\n\n'
                      'ORNEKUSDT · aday fiyat borsası MEXC\n\n'
                      'Kaynak: OKX, açık pozisyon değeri en büyük %5 yatırımcı grubunun pozisyon dağılımı\n\n'
                      '**Short payı yükseliyor: %60.00 → %65.00**\n\n'
                      'Değişim: **+5.00 yüzde puan**; göreli değişim **+%8.33**\n\n'
                      'Son long payı: **%35.00**\n\n'
                      f'Örnek veri saatleri: {previous:%d.%m.%Y %H:%M} → {current:%d.%m.%Y %H:%M} TR (5 dk)\n\n'
                      f'Test gönderim saati: {current:%d.%m.%Y %H:%M} TR\n\n'
                      'Bu grubun pozisyon dağılımıdır; tüm piyasanın veya MEXC toplamının oranı değildir. '
                      'Oran artışı tek başına yeni short açıldığını kanıtlamaz. Yeni alım/satım sinyali değildir.\n\n'
                      + marker)
              request = Request(url, data=json.dumps(payload, ensure_ascii=False).encode(), headers=headers)
              with urlopen(request, timeout=25) as response:
                  issue = json.load(response)
          print('Notification test issue: ' + issue['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('[Bildirim denemesi](' + issue['html_url'] + ')\n')
          PY
