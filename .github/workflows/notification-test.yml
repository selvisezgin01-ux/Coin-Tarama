name: Telefon bildirimi denemesi

on:
  workflow_dispatch:
    inputs:
      scan_label:
        description: Bildirimde gösterilecek sürüm
        type: choice
        default: Coin Tarama 2
        options:
          - Coin Tarama 2
          - Coin Tarama 3
          - Coin Tarama 5
          - Coin Tarama Meme
          - Coin Tarama Meme V6 — örnek sinyal
          - Shortçu Kıstır
          - Shortçu Kıstır — oran değişimi

permissions:
  issues: write

concurrency:
  group: coin-notification-test
  cancel-in-progress: false

jobs:
  notification-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send clearly marked test mention from the scanner bot
        env:
          GH_TOKEN: ${{ github.token }}
          COIN_NOTIFY_USER: ${{ vars.COIN_NOTIFY_USER }}
          COIN_SCAN_LABEL: ${{ inputs.scan_label || 'Coin Tarama 2' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen

          recipient = os.environ['COIN_NOTIFY_USER'].strip()
          label = os.environ['COIN_SCAN_LABEL']
          if label not in ('Coin Tarama 2', 'Coin Tarama 3', 'Coin Tarama Meme', 'Coin Tarama Meme V6 — örnek sinyal', 'Shortçu Kıstır', 'Shortçu Kıstır — oran değişimi', 'Coin Tarama 5'):
              raise ValueError('Unknown scanner label.')
          if not re.fullmatch(r'[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?', recipient):
              raise ValueError('Set COIN_NOTIFY_USER to a GitHub username without @.')
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          marker = f"<!-- coin-scanner:mobile-notification-test:{os.environ['GITHUB_RUN_ID']} -->"
          with urlopen(Request(url + '?state=all&per_page=100', headers=headers), timeout=25) as response:
              issues = json.load(response)
          existing = next((i for i in issues if marker in (i.get('body') or '')), None)
          if existing:
              issue = existing
          else:
              payload = {'title': label + ' · Bildirim denemesi — coin sinyali değildir',
                         'body': f'@{recipient}\n\n{label}\n\nBu, GitHub Mobile bildirimini kontrol etmek için gönderilen tek seferlik deneme kaydıdır. Coin adayı veya alım sinyali değildir. Yeni aday bildirimleri de seni bu şekilde etiketleyecek.\n\nTelefonunda GitHub için etiketlenme, bildirim ve ses izinlerini açık tut. Ses, telefonun sessiz/odak modu ve uygulama ayarlarına bağlıdır.\n\n' + marker}
              if label == 'Coin Tarama 5':
                  payload['title'] = 'TEST · Coin Tarama 5 · Bildirim denemesi — gerçek sinyal değildir'
                  payload['body'] = (
                      f'@{recipient}\n\n'
                      '**COIN TARAMA 5 — TEST BİLDİRİMİ**\n\n'
                      'Bu tek seferlik mesaj, yeni taramanın GitHub Mobile bildirimini denemek içindir. '
                      'Gerçek coin adayı veya alım/satım sinyali değildir.\n\n'
                      'Gerçek bildirimlerde HAZIRLIK, TETİKLENDİ, İPTAL veya SÜRE DOLDU etiketi; '
                      'coin/borsa, gerçek fiyat ve saat, sabit direnç ve geçersizlik seviyesi gösterilecek. '
                      'OI değişimi ile Binance/OKX kaynak gruplarının short/long oranları ayrı yazılacak.\n\n'
                      'Rapor: https://github.com/' + os.environ['GITHUB_REPOSITORY'] +
                      '/blob/scanner-state-coin-tarama-5/report.md\n\n' + marker)
              if label == 'Coin Tarama Meme V6 — örnek sinyal':
                  from datetime import datetime
                  from zoneinfo import ZoneInfo
                  current = datetime.now(ZoneInfo('Europe/Istanbul'))
                  payload['title'] = 'TEST · Meme V6 · İlk taban + alım yönlü erken hacim · GERÇEK SİNYAL DEĞİL'
                  payload['body'] = (
                      f'@{recipient}\n\n'
                      '# TEST — GERÇEK COIN SİNYALİ DEĞİLDİR\n\n'
                      '**Aşağıdaki token, kontrat, fiyat, hacim ve güvenlik sonuçları tamamen örnektir. '
                      'Bu mesaj yalnız gerçek bildirimin nasıl görüneceğini gösterir.**\n\n'
                      '**Coin Tarama Meme V6 — ilk taban + alım yönlü erken hacim**\n\n'
                      'ORNEK · Solana · 5 dk erken aday · Birikim\n\n'
                      'Ağ: **Solana**\n\n'
                      'Kontrat / token adresi (örnek yer tutucu; gerçek adres değildir):\n'
                      '```text\nORNEK_ADRES_GERCEK_TOKEN_DEGILDIR\n```\n\n'
                      '**MCAP:** $150.000 — örnek gözlem değeri\n'
                      '**Fiyat:** $0,000150 — örnek\n'
                      '**İlk taban:** 3 kapalı 5 dk mum\n'
                      '**Hacim artışı:** 2,40x — taban medyanı $1.500 → son kapalı mum $3.600\n\n'
                      '**Aynı kapalı 5 dk işlem örneğinde:**\n\n'
                      '- Alım: **$2.700**\n'
                      '- Satım: **$900**\n'
                      '- Alım–satım tutar farkı: **+$1.800**\n'
                      '- Alım hacmi payı: **%75**\n'
                      '- İşlem adedi: 12 alım / 4 satım\n'
                      '- Net alıcı işlem başlatıcı adresi: **6**\n\n'
                      'Bunlar sınırlı işlem örneğidir; bağımsız yatırımcı, balina veya toplam sermaye girişi kanıtı değildir.\n\n'
                      '**Güvenlik — yalnız örnek senaryo:** Kontrat ön kontrollerinde engel görülmedi; '
                      'bu gerçek bir token için alınmış güvenlik raporu değildir. '
                      'Geliştirici değerlendirmesi gerçek bildirimde yalnız taranan 45 dakikalık pencereyi kapsar; '
                      'ömür boyu hiç satmadığı anlamına gelmez.\n\n'
                      '**Bubblemaps cüzdan haritası MANUEL KONTROL EDİLMELİ.** '
                      'Gerçek bildirimde tokena ait harita ve DexScreener bağlantıları da bulunur. '
                      'Bu örnekte alınıp satılabilir bir token bağlantısı kullanılmadı.\n\n'
                      'Gerçek mesaj filtreleri sağlayan izleme kaydıdır; otomatik alım emri veya getiri garantisi değildir. '
                      'Resmî/orijinal kontrat kimliği ayrıca kontrol edilmelidir.\n\n'
                      f'Test gönderim saati: {current:%d.%m.%Y %H:%M:%S} Türkiye\n\n'
                      'Güncel tarama raporu: https://github.com/' + os.environ['GITHUB_REPOSITORY'] +
                      '/blob/scanner-state-meme-v6/report.md\n\n' + marker)
              if label == 'Shortçu Kıstır — oran değişimi':
                  from datetime import datetime, timedelta
                  from zoneinfo import ZoneInfo
                  current = datetime.now(ZoneInfo('Europe/Istanbul')).replace(second=0, microsecond=0)
                  previous = current - timedelta(minutes=5)
                  payload['title'] = 'TEST · Shortçu Kıstır · Short payı yükseliyor · %60 → %65'
                  payload['body'] = (
                      f'@{recipient}\n\n'
                      '**TEST — aşağıdaki coin ve oranlar örnektir; gerçek piyasa verisi veya sinyal değildir.**\n\n'
                      'ORNEKUSDT · aday fiyat borsası MEXC\n\n'
                      'Kaynak: OKX, açık pozisyon değeri en büyük %5 yatırımcı grubunun pozisyon dağılımı\n\n'
                      '**Short payı yükseliyor: %60.00 → %65.00**\n\n'
                      'Değişim: **+5.00 yüzde puan**; göreli değişim **+%8.33**\n\n'
                      'Son long payı: **%35.00**\n\n'
                      f'Örnek veri saatleri: {previous:%d.%m.%Y %H:%M} → {current:%d.%m.%Y %H:%M} TR (5 dk)\n\n'
                      f'Test gönderim saati: {current:%d.%m.%Y %H:%M} TR\n\n'
                      'Bu grubun pozisyon dağılımıdır; tüm piyasanın veya MEXC toplamının oranı değildir. '
                      'Oran artışı tek başına yeni short açıldığını kanıtlamaz. Yeni alım/satım sinyali değildir.\n\n'
                      + marker)
              request = Request(url, data=json.dumps(payload, ensure_ascii=False).encode(), headers=headers)
              with urlopen(request, timeout=25) as response:
                  issue = json.load(response)
          print('Notification test issue: ' + issue['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('[Bildirim denemesi](' + issue['html_url'] + ')\n')
          PY
