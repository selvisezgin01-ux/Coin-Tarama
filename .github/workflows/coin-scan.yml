name: MEXC + OKX coin scanner

on:
  schedule:
    # UTC: Turkey is UTC+3, so these are 03:05, 07:05, ..., 23:05 TR.
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: coin-scanner-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      SCANNER_STATE_BRANCH: ${{ vars.SCANNER_STATE_BRANCH || 'scanner-state' }}
      NOTIFICATION_CHANNEL: ${{ vars.NOTIFICATION_CHANNEL || 'report' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore independent watch state
        run: python github_scan.py pull-state
      - name: Scan both exchanges
        run: python github_scan.py scan
      - name: Checkpoint candidates before notification
        run: python github_scan.py push-state
      - name: Send optional new-candidate notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_NOTIFY_USER: ${{ vars.GITHUB_NOTIFY_USER }}
        run: python github_scan.py notify --channel "$NOTIFICATION_CHANNEL"
      - name: Save notification state
        if: ${{ always() && hashFiles('cloud_output/parent.txt') != '' && hashFiles('cloud_output/state.json') != '' }}
        run: python github_scan.py push-state
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coin-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud_output/report.md
            cloud_output/scan.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Mark partial exchange failures
        if: ${{ always() && hashFiles('cloud_output/scan.json') != '' }}
        run: python github_scan.py check-status
